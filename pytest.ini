[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --html=reports/report.html
    --self-contained-html
    -v
    -s
    --headed
    --slowmo=1000
markers =
    login: marks tests for login functionality
    bugs: marks tests for bug validation
    smoke: marks tests as smoke tests
